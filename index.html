<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Aania 🐾</title><meta name="theme-color" content="#fff8ee"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f9c6d4;--pink2:#f3a6bd;--cream:#fff8ee;--lav:#d9ccf2;--yel:#fdf0b0;--ink:#5a3446;--h:'Fredoka','Baloo 2','Trebuchet MS',sans-serif;--b:'Nunito','Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--b);font-weight:700}
body{background:radial-gradient(circle at 15% 10%,var(--yel) 0,transparent 35%),radial-gradient(circle at 90% 85%,var(--lav) 0,transparent 40%),var(--cream)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(56px + env(safe-area-inset-top,0px)) 20px calc(44px + env(safe-area-inset-bottom,0px));text-align:center;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:scale(1.04) translateY(10px);transition:opacity .5s,transform .5s,visibility 0s .5s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s,transform .5s}
h1,h2{font-family:var(--h);margin:0;line-height:1.15}
h1{font-size:clamp(2rem,9vw,2.8rem)}h2{font-size:clamp(1.4rem,6.5vw,1.9rem)}
p{margin:0;font-size:1.05rem}
.btn{font-family:var(--h);font-size:1.15rem;font-weight:600;color:var(--ink);background:var(--pink);border:3px solid var(--ink);border-radius:999px;padding:14px 28px;min-height:52px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--lav);font-size:1rem;padding:10px 20px;min-height:46px}
.btn:focus-visible,#snd:focus-visible,.tap:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:50;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--yel);font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
#dots{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:14px;z-index:50;display:flex;gap:6px;pointer-events:none}
#dots svg{width:20px;height:20px;fill:var(--lav);transition:.3s}#dots svg.on{fill:var(--pink2);transform:scale(1.3)}
.deco{position:absolute;pointer-events:none;z-index:0;opacity:.8}
.scene>*:not(.deco){position:relative;z-index:1}
.fx{position:fixed;pointer-events:none;z-index:40;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.up{position:fixed;pointer-events:none;z-index:40;font-size:1.6rem;animation:up 2s ease-out forwards}
@keyframes up{to{transform:translateY(-220px) rotate(20deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}to{transform:none;opacity:1}}
@keyframes tw{50%{transform:scale(1.3) rotate(15deg);opacity:.5}}
/* p1 */
.photo{position:relative;width:min(70vw,300px,38dvh);aspect-ratio:560/609;margin-top:34px;animation:pop .8s .2s both}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:46% 46% 40% 40%/40% 40% 46% 46%;border:5px solid #fff;box-shadow:0 10px 24px rgba(90,52,70,.25);display:block}
.hat{position:absolute;left:var(--hx,50%);top:var(--hy,-27%);width:var(--hw,38%);transform:translateX(-50%) rotate(var(--hr,7deg));filter:drop-shadow(0 3px 2px rgba(90,52,70,.3));animation:bob 3s infinite}
.spark{position:absolute;right:-6%;top:6%;font-size:1.6rem;animation:tw 1.6s infinite}
/* p2 */
.stage{position:relative;width:260px;height:300px}
.env{position:absolute;left:0;bottom:0;width:260px;height:170px;filter:drop-shadow(0 10px 8px rgba(90,52,70,.25))}
.env .back{position:absolute;inset:0;background:var(--pink2);border-radius:10px}
.note{position:absolute;left:18px;bottom:12px;width:224px;height:170px;background:#fffdf6;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;transition:transform .7s .45s cubic-bezier(.3,1.3,.5,1);z-index:2;background-image:repeating-linear-gradient(transparent 0 25px,var(--lav) 25px 26px)}
.note span{font-family:var(--h);font-size:1.2rem;line-height:1.35;display:block}
.note span.in{animation:pop .45s both}
.front{position:absolute;inset:0;background:var(--pink);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:10px;z-index:3}
.flap{position:absolute;left:0;top:0;width:100%;height:95px;background:#f6b3c6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;z-index:4;border-radius:10px 10px 0 0}
.seal{position:absolute;left:50%;top:62px;width:44px;margin-left:-22px;z-index:5;transition:opacity .3s,transform .4s;animation:bob 2.5s infinite}
.stage.open .flap{transform:rotateX(180deg);z-index:1;transition:transform .5s,z-index 0s .25s}
.stage.open .note{transform:translateY(-125px)}
.stage.open .seal{opacity:0;transform:scale(.3)}
.stage .tap{position:absolute;inset:0;z-index:6;background:none;border:0;cursor:pointer}
.stage.open .tap{display:none}
/* p3 */
.dept{display:flex;align-items:center;gap:18px}
.ruler{position:relative;width:34px;height:190px;background:var(--yel);border:3px solid var(--ink);border-radius:6px;background-image:repeating-linear-gradient(var(--ink) 0 2px,transparent 2px 19px);background-size:14px 100%;background-repeat:no-repeat;animation:pop .6s both}
.ruler i{position:absolute;left:-10px;width:54px;height:4px;background:var(--pink2);border-radius:3px;top:30%;animation:meas 2.4s ease-in-out infinite alternate}
@keyframes meas{to{top:62%}}
.joke{min-height:110px;width:min(210px,52vw);display:flex;align-items:center;justify-content:center;font-family:var(--h);font-size:1.35rem;line-height:1.3;text-align:left}
.joke.in{animation:pop .45s both}
#res{min-height:34px;font-family:var(--h);font-size:1.15rem;display:flex;align-items:center;gap:8px}
.spin{width:20px;height:20px;border:4px solid var(--lav);border-top-color:var(--pink2);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sh .5s}
@keyframes sh{25%{transform:rotate(-8deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.1)}}
/* p4 */
.mb{position:relative;width:230px;height:190px;margin:36px 0 8px;perspective:600px;background:none;border:0;cursor:pointer;padding:0}
.mb .base{position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(var(--pink),var(--pink2));border:3px solid var(--ink);border-radius:12px 12px 18px 18px;box-shadow:0 12px 14px rgba(90,52,70,.25)}
.mb .inner{position:absolute;bottom:105px;left:12px;right:12px;height:14px;background:var(--cream);border:3px solid var(--ink);border-radius:8px}
.mb .lid{position:absolute;bottom:108px;left:0;right:0;height:70px;background:var(--lav);border:3px solid var(--ink);border-radius:14px 14px 4px 4px;transform-origin:bottom;transition:transform .8s cubic-bezier(.3,1.2,.5,1);display:flex;align-items:center;justify-content:center}
.mb.open .lid{transform:rotateX(-115deg)}
.mb .face{position:absolute;bottom:20px;left:0;right:0;text-align:center}
.mb.open .dancer{opacity:1;transform:translateY(-28px)}
.dancer{position:absolute;bottom:112px;left:50%;margin-left:-20px;width:40px;opacity:0;transition:.6s .3s;z-index:0}
.mb.play .dancer{animation:dance 1s ease-in-out infinite alternate}@keyframes dance{from{transform:translateY(-28px) rotate(-8deg)}to{transform:translateY(-40px) rotate(8deg)}}.scene:not(.on) *{animation-play-state:paused}.photo{cursor:pointer}#res{flex-wrap:wrap;justify-content:center}html{-webkit-text-size-adjust:100%}#fin{min-height:92px;opacity:0;transition:opacity .5s}#fin.on{opacity:1}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;visibility:hidden}.row.on{visibility:visible}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}.fx,.up{display:none}}
</style></head><body>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ctx=null,on=true,cur=0,song={g:null,t:null};
/* dots */
$('#dots').innerHTML=[0,1,2,3].map(()=>'<svg viewBox="0 0 24 24"><use href="#paw"/></svg>').join('');
const dots=$$('#dots svg');
/* audio */
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,t,d,o){o=o||{};const os=ctx.createOscillator(),g=ctx.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o.out||ctx.destination);os.start(t);os.stop(t+d+.05)}
function sfx(n){if(!on||!ac())return;const t=ctx.currentTime;
if(n==='pop')tone(500,t,.1,{to:900,v:.1});
else if(n==='click')tone(1200,t,.05,{type:'triangle',v:.07});
else if(n==='chime'){tone(1047,t,.45,{v:.08});tone(1568,t+.08,.45,{v:.06})}
else if(n==='boing')tone(300,t,.25,{to:750,type:'triangle',v:.1});
else if(n==='meow'){tone(500,t,.15,{to:900,type:'triangle',v:.07});tone(900,t+.15,.28,{to:450,type:'triangle',v:.07})}
else if(n==='rustle'){const b=ctx.createBuffer(1,ctx.sampleRate*.45,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*(Math.sin(i/900)>-.3?1:.3);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=3500;g.gain.value=.12;s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t)}
else if(n==='box'){tone(900,t,.05,{type:'triangle',v:.08});tone(1319,t+.12,.6,{v:.07});tone(1760,t+.22,.6,{v:.05})}}
const M=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function stopSong(){clearTimeout(song.t);clearInterval(song.n);$('#mb').classList.remove('play');if(song.w&&ctx){try{song.w.gain.setTargetAtTime(0,ctx.currentTime,.03)}catch(e){}song.w=null}if(song.g&&ctx){const g=song.g;try{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setTargetAtTime(0,ctx.currentTime,.03)}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},400)}song.g=null;$('#stop').disabled=true}
function playSong(){stopSong();if(!ac())return;const g=ctx.createGain();g.gain.value=1;g.connect(ctx.destination);const dl=ctx.createDelay(),fb=ctx.createGain(),wet=ctx.createGain();dl.delayTime.value=.23;fb.gain.value=.3;wet.gain.value=.35;g.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ctx.destination);song.g=g;song.w=wet;$('#mb').classList.add('play');song.n=setInterval(()=>floaters(['♪','♫'],1),700);let t=ctx.currentTime+.15;const B=.4;
M.forEach(n=>{tone(n[0]*2,t,1.1,{v:.1,out:g});tone(n[0]*4,t,.35,{v:.03,out:g,type:'triangle'});t+=n[1]*B});
$('#stop').disabled=false;song.t=setTimeout(()=>{stopSong()},(t-ctx.currentTime)*1000+800)}
function setSound(v){on=v;$('#snd').textContent=v?'🔊':'🔇';$('#snd').setAttribute('aria-pressed',v);$('#snd').setAttribute('aria-label',v?'Sound on':'Sound off');if(!v)stopSong()}
$('#snd').onclick=()=>{ac();setSound(!on);if(on)sfx('meow')};
/* fx */
const cols=['#f9a8c4','#fdf0b0','#d9ccf2','#f3a6bd'];
function confetti(n){if(reduce)return;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='fx';e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%4]};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5200)}}
function floaters(chars,n){if(reduce)return;for(let i=0;i<n;i++){const e=document.createElement('span');e.className='up';e.textContent=chars[i%chars.length];e.style.cssText=`left:${20+Math.random()*60}vw;top:${55+Math.random()*20}vh;animation-delay:${i*.15}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}}
/* nav */
const scenes=$$('.scene');
function go(n){cur=n;scenes.forEach((s,i)=>s.classList.toggle('on',i===n));dots.forEach((d,i)=>d.classList.toggle('on',i===n));scenes[n].scrollTop=0;setTimeout(()=>{const b=scenes[n].querySelector(n===3?'#mb':'.btn:not([hidden]),.tap');b&&b.focus({preventScroll:true})},520);if(n===2&&!jokeShown)nextJoke()}
$$('[data-go]').forEach(b=>b.onclick=()=>{sfx('pop');go(+b.dataset.go)});
/* p1 intro */
go(0);confetti(14);setTimeout(()=>sfx('meow'),300);
/* p2 */
const wishes=['hope this year brings you lots of happiness ✨','may all your plans work out perfectly!','may your cake be big and your problems tiny 🎂','hope you get everything you’ve been wishing for!','and obviously, may you get lots of good food too.'];
let w=0;
function showWish(){const e=$('#wish');e.classList.remove('in');void e.offsetWidth;e.textContent=wishes[w];e.classList.add('in');$('#cnt').textContent=(w+1)+' / 5';$('#nw').textContent=w===wishes.length-1?'one more thing →':'next wish →'}
$('#stage .tap').onclick=()=>{sfx('rustle');$('#stage').classList.add('open');$('#hint').hidden=true;$('#nw').hidden=false;setTimeout(()=>{showWish();floaters(['✨','⭐','♡'],5)},650)};
$('#nw').onclick=()=>{if(w<wishes.length-1){w++;sfx('chime');showWish()}else{sfx('pop');go(2)}};
/* p3 */
const jokes=['height update: still pending.','the cake might be taller than you 🎂','vertically smol, birthday privileges unlimited.'];
let j=-1,jokeShown=false;
function nextJoke(){jokeShown=true;if(j>=jokes.length-1){sfx('pop');go(3);return}j++;if(j>0)sfx('pop');const e=$('#joke');e.classList.remove('in');void e.offsetWidth;e.textContent=jokes[j];e.classList.add('in');if(j===jokes.length-1)$('#nj').textContent='okay okay, last page →'}
$('#nj').onclick=nextJoke;
let busy=false,k=0;const caps=['checked once. results unchanged.','checked twice. the ruler is confused.','checked again. the cat is unimpressed.','the department thanks you for your patience.'];
$('#chk').onclick=()=>{if(busy)return;busy=true;sfx('boing');const r=$('#res');r.innerHTML='<span class="spin"></span>checking…';setTimeout(()=>{r.innerHTML='<span id="rc">no new height detected 😭</span> <span id="cr">🙀</span><small style="width:100%;font-family:var(--b);opacity:.7;font-size:.85rem">'+caps[k++%caps.length]+'</small>';$('#cr').classList.add('shake');sfx('pop');floaters(['⭐','✨'],4);busy=false},1000)};
/* p4 */
let opened=false;
$('#mb').onclick=()=>{setSound(true);ac();if(opened)return;opened=true;sfx('box');$('#mb').classList.add('open');$('#sub').hidden=true;$('#fin').classList.add('on');$('#row').classList.add('on');confetti(26);floaters(['♪','♫','★','✨'],8);setTimeout(playSong,400)};
$('#again').onclick=()=>{setSound(true);ac();playSong();floaters(['♪','♫'],5)};
